- name: Test the imds_facts module
  hosts: test
  gather_facts: false # dont need the other facts for testing this. it just slows us down.
  tasks:
    - name: Gather imds facts
      timtrense.imds.imds_facts:
        provider: auto
        query: [availability_zone, userdata]
        allow_failed_queries: [tags]
        http_timeout_seconds: 0.1
        provider_params:
          hetzner_account: abc
    - name: Dump test output
      debug:
        var: ansible_facts
